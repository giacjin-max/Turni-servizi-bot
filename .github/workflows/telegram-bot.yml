name: Turni Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"     # sender + reminder (ogni ora)
    - cron: "*/5 * * * *"   # receiver (ogni 5 minuti)

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # =====================
      # CHECKOUT
      # =====================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =====================
      # PYTHON
      # =====================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      # =====================
      # RESET SETTIMANALE (SICURO)
      # =====================
      - name: Weekly reset (safe inside sender logic)
        run: python -c "
import json;
import datetime;

now = datetime.datetime.now();

# reset SOLO lunedì notte
if now.weekday() == 0 and now.hour < 1:
    json.dump({}, open('responses.json','w'));
    json.dump({}, open('reminder_log.json','w'));
    json.dump({'offset':0}, open('offset.json','w'));
    print('Reset settimanale eseguito')
else:
    print('No reset')
"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # =====================
      # RUN BOT
      # =====================

      - name: Run sender
        run: python sender.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Run receiver
        run: python receiver.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Run reminder
        run: python reminder.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # =====================
      # COMMIT DATI (PERSISTENZA)
      # =====================

      - name: Commit updated JSON files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add responses.json offset.json reminder_log.json

          git diff --staged --quiet || git commit -m "Update bot state"

      - name: Push changes
        run: git push
