name: Turni Telegram Bot

on:
  workflow_dispatch:
  schedule:
    # LUNEDÌ MATTINA - invio turni
    - cron: "0 7 * * 1"

    # GIOVEDÌ SERA - reminder mancanti
    - cron: "0 18 * * 4"

    # SABATO MATTINA - promemoria domenica
    - cron: "0 7 * * 6"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask requests supabase pandas openpyxl

      # =====================
      # LUNEDÌ → SEND TURNI
      # =====================
      - name: Run sender (Monday)
        if: github.event.schedule == '0 7 * * 1'
        run: python sender.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # =====================
      # GIOVEDÌ → REMINDER
      # =====================
      - name: Run reminder (Thursday)
        if: github.event.schedule == '0 18 * * 4'
        run: python reminder.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # =====================
      # SABATO → PROMEMORIA DOMENICA
      # =====================
      - name: Run sunday reminder (Saturday)
        if: github.event.schedule == '0 7 * * 6'
        run: python reminder_sunday.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # =====================
      # COMMIT STATE
      # =====================
      - name: Commit bot state
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "update bot state"

      - name: Push changes
        run: git push
