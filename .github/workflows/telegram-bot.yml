name: Turni Telegram Bot

on:
  workflow_dispatch:

  schedule:
    # Lunedì mattina (UTC 06:00 ≈ 08:00 Italia)
    - cron: "0 6 * * 1"

    # Mercoledì mattina
    - cron: "0 6 * * 3"

    # Sabato mattina
    - cron: "0 6 * * 6"

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # =====================
      # CHECKOUT
      # =====================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =====================
      # PYTHON
      # =====================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
  run: pip install pandas openpyxl requests flask supabase

      # =====================
      # MANUAL RUN (INVIA TURNI)
      # =====================
      - name: Manual run (sender)
        if: github.event_name == 'workflow_dispatch'
        run: python sender.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # =====================
      # LUNEDÌ → SOLO TURNI
      # =====================
      - name: Monday sender
        if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1'
        run: python sender.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # =====================
      # MERCOLEDÌ → TURNI + REMINDER MANCANTI
      # =====================
      - name: Wednesday sender
        if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 3'
        run: python sender.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Wednesday reminder (missing only)
        if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 3'
        run: python reminder.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # =====================
      # SABATO → REMINDER GENERALE
      # =====================
      - name: Saturday reminder all
        if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 6'
        run: python reminder_all.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # =====================
      # SALVATAGGIO STATO
      # =====================
      - name: Commit bot state
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add offset.json reminder_log.json expected_users.json

          git diff --staged --quiet || git commit -m "Update bot state"

      - name: Push changes
        run: git push
